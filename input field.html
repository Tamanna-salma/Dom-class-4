<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input field</title>
</head>
<body>
     <!--qus:(1) Text Update by adding Eventlistner from input field and other elements -->
     <h2 id="heading">Enter your Name</h2>
     <input id="name" type="text">
<button id="btn">Add</button>

<!-- or -->

<h1 id="updateText">Enter Your Name</h1>
<input id="inputText" type="text">
<button id="submitBtn">Submit</button>

<script>
const fun=()=>{
const inputfield=document.querySelector('#name').value;
const display=document.getElementById('heading');
display.textContent=inputfield;
}
document.getElementById('btn').addEventListener('click',fun)
document.getElementById('submitBtn').addEventListener('click', ()=>{
const inputField= document.querySelector('#inputText');
const getValue=inputField.value;
const textUpdate= document.getElementById('updateText');
textUpdate.innerText=getValue;

})

</script>
</body>
</html>
